<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SKEMA UNINDRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Login Container -->
    <div id="login-container" class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-2xl font-bold text-slate-900 mb-2 text-center">Login Admin SKEMA</h2>
            <p class="text-sm text-gray-500 text-center mb-6">Masuk untuk mengelola data organisasi</p>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="admin-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="admin-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Masuk Admin</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div id="dashboard-container" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-900 text-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">SKEMA UNINDRA - Panel Admin</h1>
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-sm text-indigo-300 hover:underline">Lihat Website</a>
                    <button id="logout-btn" class="bg-red-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-700 transition">Keluar</button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 space-y-10">
            <!-- SECTION PENGURUS CRUD -->
            <section class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-900">Kelola Pengurus</h2>
                    <button onclick="openModal('pengurus')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">+ Tambah Pengurus</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b bg-gray-50 text-xs font-semibold text-gray-600 uppercase">
                                <th class="p-3">Nama</th>
                                <th class="p-3">Jabatan</th>
                                <th class="p-3">Divisi</th>
                                <th class="p-3">Prodi</th>
                                <th class="p-3">Angkatan</th>
                                <th class="p-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-pengurus" class="divide-y text-sm"></tbody>
                    </table>
                </div>
            </section>

            <!-- SECTION AGENDA CRUD -->
            <section class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-900">Kelola Agenda</h2>
                    <button onclick="openModal('agenda')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">+ Tambah Agenda</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b bg-gray-50 text-xs font-semibold text-gray-600 uppercase">
                                <th class="p-3">Kegiatan</th>
                                <th class="p-3">Waktu</th>
                                <th class="p-3">Jenis</th>
                                <th class="p-3">Lampiran</th>
                                <th class="p-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-agenda" class="divide-y text-sm"></tbody>
                    </table>
                </div>
            </section>

            <!-- SECTION KARYA CRUD -->
            <section class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-900">Kelola Karya</h2>
                    <button onclick="openModal('karya')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">+ Tambah Karya</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b bg-gray-50 text-xs font-semibold text-gray-600 uppercase">
                                <th class="p-3">Judul</th>
                                <th class="p-3">Jenis</th>
                                <th class="p-3">Penulis</th>
                                <th class="p-3">Tahun</th>
                                <th class="p-3">File / Foto</th>
                                <th class="p-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-karya" class="divide-y text-sm"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL FORM UNIVERSAL -->
    <div id="crud-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl">
            <h3 id="modal-title" class="text-lg font-bold mb-4">Form Data</h3>
            <form id="crud-form" class="space-y-4">
                <input type="hidden" id="modal-type">
                <input type="hidden" id="modal-id">
                <div id="form-fields" class="space-y-3"></div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="db.js"></script>
    <script src="admin.js"></script>
</body>
</html>
